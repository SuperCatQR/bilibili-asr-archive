name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A pull request can receive several pushes while a job is running. Keep only
# the newest validation for that PR; a main-branch run remains non-cancellable.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: tests / python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bilibili-asr-archive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bilibili-asr-archive/pyproject.toml
            bilibili-asr-archive/uv.lock

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Compile source and test trees
        run: python -m compileall -q src tests scripts

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run tests
        run: |
          mkdir -p test-results
          python -m pytest -q --durations=25 --junitxml=test-results/pytest.xml

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ github.run_id }}
          path: |
            bilibili-asr-archive/test-results/pytest.xml
            bilibili-asr-archive/.tb/errors.log
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: package / installed smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bilibili-asr-archive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bilibili-asr-archive/pyproject.toml
            bilibili-asr-archive/uv.lock

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install dist/*.whl

      - name: Verify installed command and packaged resources
        run: |
          .ci-venv/bin/bili-asr --help
          .ci-venv/bin/python - <<'PY'
          from importlib.resources import files

          storage = files("bili_asr.storage")
          required = {
              "schema.sql",
              "schema-transcripts.sql",
              "schema-workflow.sql",
              "schema-editorial.sql",
          }
          missing = sorted(name for name in required if not storage.joinpath(name).is_file())
          if missing:
              raise SystemExit(f"packaged storage resources missing: {missing}")
          PY

      - name: Upload distribution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ github.run_id }}
          path: bilibili-asr-archive/dist/*
          if-no-files-found: error
          retention-days: 14

  harness:
    name: tests / harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the harness validator
        run: npm install --global @mstar-harness/cli@3.11.2

      - name: Validate tracked harness state
        run: python bilibili-asr-archive/scripts/validate_harness_state.py .mstar
