name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A pull request can receive several pushes while a job is running. Keep only
# the newest validation for that PR; a main-branch run remains non-cancellable.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: quality / syntax and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # The repository is being migrated toward full Ruff coverage. E9 is the
      # zero-noise, blocking subset that catches syntax failures today without
      # turning legacy style debt into a false regression signal.
      - name: Run blocking Ruff checks
        run: python -m ruff check src scripts tests --select E9

      - name: Compile source and test trees
        run: python -m compileall -q src tests scripts

  security:
    name: security / dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install project and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit resolved dependencies
        run: |
          python -m pip freeze | grep -v -E '^(bili-asr|-e .*#egg=bili_asr)' > audit-requirements.txt
          python -m pip_audit --strict --desc on -r audit-requirements.txt

  python:
    name: tests / python (${{ matrix.shard.label }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {index: 0, label: "1"}
          - {index: 1, label: "2"}
          - {index: 2, label: "3"}
          - {index: 3, label: "4"}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Compile source and test trees
        run: python -m compileall -q src tests scripts

      - name: Run tests
        run: |
          mkdir -p test-results
          python scripts/pytest_shard.py \
            --shard-index ${{ matrix.shard.index }} \
            --shard-count 4 \
            -- \
            -q --durations=25 \
            --junitxml=test-results/pytest-${{ matrix.shard.label }}.xml

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-diagnostics-${{ github.run_id }}-${{ matrix.shard.label }}
          path: |
            test-results/pytest-${{ matrix.shard.label }}.xml
            .tb/errors.log
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: package / installed smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install dist/*.whl

      - name: Verify installed command and packaged resources
        run: |
          .ci-venv/bin/bili-asr --help
          .ci-venv/bin/python - <<'PY'
          from importlib.resources import files

          storage = files("bili_asr.storage")
          required = {
              "schema.sql",
              "schema-transcripts.sql",
              "schema-workflow.sql",
              "schema-editorial.sql",
          }
          missing = sorted(name for name in required if not storage.joinpath(name).is_file())
          if missing:
              raise SystemExit(f"packaged storage resources missing: {missing}")
          PY

      - name: Write build provenance and checksums
        run: |
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILDINFO
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload distribution artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ github.run_id }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: tests / coverage report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run suite with coverage
        run: |
          python -m coverage run --branch -m pytest -q --durations=25
          python -m coverage report --show-missing
          python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
