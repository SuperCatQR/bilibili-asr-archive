name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A pull request can receive several pushes while a job is running. Keep only
# the newest validation for that PR; a main-branch run remains non-cancellable.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: quality / syntax and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install development tools
        run: python -m pip install "ruff>=0.15"

      # The repository is being migrated toward full Ruff coverage. E9 is the
      # zero-noise, blocking subset that catches syntax failures today without
      # turning legacy style debt into a false regression signal.
      - name: Run blocking Ruff checks
        run: python -m ruff check src scripts tests --select E9

      - name: Compile source and test trees
        run: python -m compileall -q src tests scripts

  security:
    name: security / dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install project and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit resolved dependencies
        run: |
          python -m pip freeze | grep -v -E '^(bili-asr|-e .*#egg=bili_asr)' > audit-requirements.txt
          python -m pip_audit --strict --desc on -r audit-requirements.txt

  python:
    name: tests / python (${{ matrix.shard.label }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {index: 0, label: "1"}
          - {index: 1, label: "2"}
          - {index: 2, label: "3"}
          - {index: 3, label: "4"}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Ensure ffmpeg is available
        timeout-minutes: 4
        run: |
          if ! ffmpeg -version > /dev/null 2>&1; then
            for attempt in 1 2; do
              echo "Installing ffmpeg (attempt ${attempt}/2)"
              if sudo timeout --kill-after=10s 90s apt-get \
                  -o Acquire::Retries=1 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 update \
                  && sudo timeout --kill-after=10s 90s apt-get \
                  -o Acquire::Retries=1 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 \
                  install -y --no-install-recommends ffmpeg; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                echo "ffmpeg installation failed after two bounded attempts" >&2
                exit 1
              fi
              sleep 5
            done
          fi
          ffmpeg -version

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Verify packaged contract schemas and documentation mirrors
        run: python -m bili_asr.contracts --check-docs docs/contracts

      - name: Prepare offline installed-test dependencies
        run: python -m pip download --dest .test-wheelhouse "jsonschema>=4.25,<5"

      - name: Run tests
        run: |
          mkdir -p test-results
          python scripts/pytest_shard.py \
            --shard-index ${{ matrix.shard.index }} \
            --shard-count 4 \
            --coverage \
            -- \
            -q --durations=25 \
            --junitxml=test-results/pytest-${{ matrix.shard.label }}.xml

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-diagnostics-${{ github.run_id }}-${{ matrix.shard.label }}
          path: |
            test-results/pytest-${{ matrix.shard.label }}.xml
            .tb/errors.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ github.run_id }}-${{ matrix.shard.label }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: package / installed smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install dist/*.whl

      - name: Verify installed command and packaged resources
        run: |
          .ci-venv/bin/bili-asr --help
          .ci-venv/bin/python -m bili_asr.contracts --check-docs docs/contracts
          .ci-venv/bin/python - <<'PY'
          from importlib.resources import files

          storage = files("bili_asr.storage")
          required = {
              "schema.sql",
              "schema-transcripts.sql",
              "schema-workflow.sql",
              "schema-editorial.sql",
              "schema-content-v2.sql",
              "schema-observations.sql",
              "schema-source-sync.sql",
              "migration-source-bilibili-v1.json",
          }
          missing = sorted(name for name in required if not storage.joinpath(name).is_file())
          if missing:
              raise SystemExit(f"packaged storage resources missing: {missing}")
          PY

      - name: Write build provenance and checksums
        run: |
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILDINFO
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload distribution artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ github.run_id }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: tests / coverage report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: python
    if: ${{ !cancelled() && (needs.python.result == 'success' || needs.python.result == 'failure') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      # Reporting reads the checked-out sources; it does not import the project.
      - name: Install coverage tooling
        run: python -m pip install "coverage[toml]>=7.10.6"

      - name: Download shard coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-data-${{ github.run_id }}-*
          merge-multiple: true

      - name: Combine coverage data
        id: combine
        run: |
          python -m coverage combine

      - name: Generate coverage report
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: |
          python -m coverage report --show-missing
          python -m coverage xml -o coverage.xml
          python -m coverage json -o coverage.json

      - name: Enforce product coverage floors
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: python scripts/check_test_coverage.py coverage.json --line-min 75 --branch-min 63

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
          retention-days: 14
