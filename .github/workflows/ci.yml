name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

# A pull request can receive several pushes while a job is running. Keep only
# the newest validation for that PR; a main-branch run remains non-cancellable.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_VERSION: "0.11.14"
  UV_DEFAULT_INDEX: "https://pypi.org/simple"
  UV_LINK_MODE: "copy"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: quality / syntax and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: quality

      - name: Install development tools
        run: |
          uv lock --check
          RUFF_VERSION=$(python -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "ruff"))')
          uv tool install "ruff==$RUFF_VERSION"
          MYPY_VERSION=$(python -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "mypy"))')
          uv tool install "mypy==$MYPY_VERSION"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      # Expand semantic checks without introducing historical style debt.
      - name: Run blocking Ruff checks
        run: ruff check src scripts tests --select E9,F821,F822,F823

      - name: Check types in filesystem and schema boundaries
        run: mypy

      - name: Compile source and test trees
        run: python -m compileall -q src tests scripts

  security:
    name: security / dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: security

      - name: Install project and audit tooling
        run: |
          python scripts/check_dependency_export.py
          uv export --locked --extra asr --extra dev --extra remote --no-emit-project --output-file audit-requirements.txt
          AUDIT_VERSION=$(python -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "pip-audit"))')
          uv tool install "pip-audit==$AUDIT_VERSION"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Audit resolved dependencies
        run: |
          pip-audit --strict --disable-pip --no-deps --desc on -r audit-requirements.txt --format json --output audit-results.json

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-requirements.txt
            audit-results.json
          if-no-files-found: ignore
          retention-days: 14

  python:
    name: tests / python (${{ matrix.shard.label }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {index: 0, label: "1"}
          - {index: 1, label: "2"}
          - {index: 2, label: "3"}
          - {index: 3, label: "4"}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-${{ matrix.shard.label }}

      - name: Ensure ffmpeg is available
        timeout-minutes: 4
        run: bash scripts/ensure_ci_ffmpeg.sh

      - name: Fetch exact contract baseline
        env:
          CONTRACT_BASELINE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [[ -n "$CONTRACT_BASELINE" && "$CONTRACT_BASELINE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$CONTRACT_BASELINE"
          fi

      - name: Install test dependencies
        run: |
          uv sync --locked --extra dev
          # Isolated installation tests also build an offline wheel with pip.
          uv pip install --python .venv/bin/python pip "setuptools>=69" wheel
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify packaged contract schemas and documentation mirrors
        run: python -m bili_asr.contracts --check-docs docs/contracts

      - name: Prepare offline installed-test dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file runtime-constraints.txt
          python -m pip download --dest .test-wheelhouse -c runtime-constraints.txt "jsonschema>=4.25,<5"

      - name: Run tests
        env:
          BILI_ASR_CONTRACT_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          mkdir -p test-results
          python scripts/pytest_shard.py \
            --shard-index ${{ matrix.shard.index }} \
            --shard-count 4 \
            --plan-output test-results/shard-plan.json \
            --coverage \
            -- \
            -q -ra --durations=25 \
            --basetemp "$RUNNER_TEMP/pytest-${{ matrix.shard.label }}" \
            --junitxml=test-results/pytest-${{ matrix.shard.label }}.xml \
            2>&1 | tee test-results/pytest.log

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard.label }}
          path: |
            test-results/
            .tb/errors.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard.label }}
          path: .coverage.*
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: package / installed smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: package

      - name: Build distribution artifacts
        run: |
          uv lock --check
          uv build --sdist --wheel

      - name: Install wheel in a clean environment
        run: |
          uv export --locked --no-dev --no-emit-project --output-file runtime-requirements.txt
          uv venv --python 3.12 .ci-venv
          uv pip install --python .ci-venv/bin/python -r runtime-requirements.txt dist/*.whl

      - name: Verify installed command and packaged resources
        run: |
          .ci-venv/bin/bili-asr --help
          .ci-venv/bin/python - <<'PY'
          from importlib.metadata import metadata
          from pathlib import Path

          project = metadata("bili-asr")
          license_expression = project.get("License-Expression") or project.get("License")
          if license_expression != "GPL-3.0-only":
              raise SystemExit(f"unexpected software license metadata: {license_expression!r}")
          if "GPL-3.0-only" not in Path("pyproject.toml").read_text(encoding="utf-8"):
              raise SystemExit("pyproject.toml does not declare GPL-3.0-only")
          if not Path("LICENSE").is_file() or not Path("CONTENT-LICENSE.md").is_file():
              raise SystemExit("release license files are incomplete")
          PY
          .ci-venv/bin/python -m bili_asr.contracts --check-docs docs/contracts
          .ci-venv/bin/python - <<'PY'
          import hashlib
          from importlib.resources import files
          from pathlib import Path, PurePosixPath
          from bili_asr.contracts import CONTRACTS

          for entry in CONTRACTS.values():
              for name in entry.authority:
                  relative = PurePosixPath(name)
                  if relative.suffix in {".sql", ".json"}:
                      relative = relative.relative_to("src/bili_asr")
                      body = files("bili_asr").joinpath(*relative.parts).read_bytes()
                      expected = Path(name).read_bytes()
                      if not body or hashlib.sha256(body).digest() != hashlib.sha256(expected).digest():
                          raise SystemExit(f"packaged contract resource differs: {name}")
          PY

      - name: Write build provenance and checksums
        run: |
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILDINFO
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload distribution artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: tests / Windows locks and recovery
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: windows
      - name: Install test dependencies
        run: uv sync --locked --extra dev
      - name: Exercise real Windows locks and isolated archive recovery
        run: |
          uv run --no-sync python -m coverage run -m pytest -q -ra `
            tests/test_file_ops.py tests/test_export_lock.py tests/test_source_supplement.py `
            tests/test_archive_fixture_isolation.py tests/test_reference_backup.py `
            --basetemp "$env:RUNNER_TEMP/pytest-windows" --junitxml=test-results/windows.xml
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
      - name: Upload Windows coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ github.run_id }}-${{ github.run_attempt }}-windows
          path: .coverage.*
          include-hidden-files: true
          retention-days: 14

  coverage:
    name: tests / coverage report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [python, windows]
    if: ${{ !cancelled() && (needs.python.result == 'success' || needs.python.result == 'failure') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: coverage

      # Reporting reads the checked-out sources; it does not import the project.
      - name: Install coverage tooling
        run: |
          COVERAGE_VERSION=$(python -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "coverage"))')
          uv venv --python 3.12 .coverage-venv
          uv pip install --python .coverage-venv/bin/python "coverage[toml]==$COVERAGE_VERSION"
          echo "$GITHUB_WORKSPACE/.coverage-venv/bin" >> "$GITHUB_PATH"

      - name: Download shard coverage data
        uses: actions/download-artifact@v7
        with:
          # A failed-job rerun may leave successful shards on an older attempt.
          # Every attempt in one run uses the same commit; combine them all.
          pattern: coverage-data-${{ github.run_id }}-*
          merge-multiple: true

      - name: Combine coverage data
        id: combine
        run: |
          python -m coverage combine

      - name: Generate coverage report
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: |
          python -m coverage report --show-missing
          python -m coverage xml -o coverage.xml
          python -m coverage json -o coverage.json

      - name: Enforce product coverage floors
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: python scripts/check_test_coverage.py coverage.json --line-min 80 --branch-min 70

      - name: Inventory uncovered critical behavior
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: python scripts/report_coverage_risks.py coverage.json

      - name: Enforce coverage of changed product code
        if: ${{ !cancelled() && steps.combine.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$COVERAGE_BASE"
          python scripts/check_changed_coverage.py coverage.json --base "$COVERAGE_BASE" --line-min 90

      - name: Download pytest diagnostics
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v7
        with:
          pattern: pytest-diagnostics-${{ github.run_id }}-*
          path: pytest-diagnostics

      - name: Summarize regression tests
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from scripts.update_pytest_durations import latest_reports
          import xml.etree.ElementTree as ET

          files = latest_reports(Path("pytest-diagnostics"), 4)
          if not files:
              raise SystemExit("no shard JUnit reports were downloaded")
          total = failures = errors = skipped = 0
          for path in files:
              for case in ET.parse(path).getroot().iter("testcase"):
                  total += 1
                  failures += int(case.find("failure") is not None)
                  errors += int(case.find("error") is not None)
                  skipped += int(case.find("skipped") is not None)
          passed = total - failures - errors - skipped
          status = "PASS" if failures == errors == 0 else "FAIL"
          lines = [
              "## Regression tests",
              "",
              f"**{status}**: {passed} passed, {failures} failed, "
              f"{errors} errors, {skipped} skipped ({total} total).",
              "",
              "Reports: " + ", ".join(path.name for path in files),
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          if failures or errors:
              raise SystemExit("regression test failures are present in shard reports")
          PY

      - name: Measure shard timing hints
        if: ${{ !cancelled() && needs.python.result == 'success' }}
        env:
          TIMING_SOURCE_REF: ${{ github.sha }}
        run: |
          python scripts/update_pytest_durations.py pytest-diagnostics \
            --shard-count 4 --source-ref "$TIMING_SOURCE_REF" \
            --output pytest-shard-durations.json

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            coverage.json
            changed-coverage.json
            coverage-risks.json
            coverage-risks.md
            pytest-shard-durations.json
          if-no-files-found: error
          retention-days: 14
