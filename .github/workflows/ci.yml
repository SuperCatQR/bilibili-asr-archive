name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

# A pull request can receive several pushes while a job is running. Keep only
# the newest validation for that PR; a main-branch run remains non-cancellable.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_VERSION: "0.11.14"
  UV_DEFAULT_INDEX: "https://pypi.org/simple"
  UV_LINK_MODE: "copy"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: quality / syntax and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile and install development environment
        run: |
          uv lock --check
          uv sync --locked --extra dev

      # The repository is being migrated toward full Ruff coverage. E9 is the
      # zero-noise, blocking subset that catches syntax failures today without
      # turning legacy style debt into a false regression signal.
      - name: Run blocking Ruff checks
        run: uv run --no-sync ruff check src scripts tests --select E9

      - name: Compile source and test trees
        run: uv run --no-sync python -m compileall -q src tests scripts

  security:
    name: security / dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile and install audit environment
        run: |
          uv lock --check
          uv sync --locked --extra dev --extra remote

      - name: Export locked dependencies
        run: |
          uv export --locked --extra dev --extra remote \
            --no-emit-project --format requirements.txt \
            --output-file audit-requirements.txt

      - name: Audit resolved dependencies
        run: uv run --no-sync pip-audit --strict --desc on -r audit-requirements.txt

  python:
    name: tests / python (${{ matrix.shard.label }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {index: 0, label: "1"}
          - {index: 1, label: "2"}
          - {index: 2, label: "3"}
          - {index: 3, label: "4"}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Ensure ffmpeg is available
        timeout-minutes: 4
        run: |
          if ! ffmpeg -version > /dev/null 2>&1; then
            for attempt in 1 2; do
              echo "Installing ffmpeg (attempt ${attempt}/2)"
              if sudo timeout --kill-after=10s 90s apt-get \
                  -o Acquire::Retries=1 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 update \
                  && sudo timeout --kill-after=10s 90s apt-get \
                  -o Acquire::Retries=1 \
                  -o Acquire::http::Timeout=20 \
                  -o Acquire::https::Timeout=20 \
                  install -y --no-install-recommends ffmpeg; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                echo "ffmpeg installation failed after two bounded attempts" >&2
                exit 1
              fi
              sleep 5
            done
          fi
          ffmpeg -version

      - name: Install test dependencies
        run: |
          uv lock --check
          uv sync --locked --extra dev

      - name: Verify packaged contract schemas and documentation mirrors
        run: uv run --no-sync python -m bili_asr.contracts --check-docs docs/contracts

      - name: Prepare offline installed-test dependencies
        run: uv run --no-sync python -m pip download --dest .test-wheelhouse "jsonschema>=4.25,<5"

      - name: Run tests
        env:
          BILI_ASR_CONTRACT_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          mkdir -p test-results
          uv run --no-sync python scripts/pytest_shard.py \
            --shard-index ${{ matrix.shard.index }} \
            --shard-count 4 \
            --coverage \
            -- \
            -q --durations=25 \
            --junitxml=test-results/pytest-${{ matrix.shard.label }}.xml

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-diagnostics-${{ github.run_id }}-${{ matrix.shard.label }}
          path: |
            test-results/pytest-${{ matrix.shard.label }}.xml
            .tb/errors.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ github.run_id }}-${{ matrix.shard.label }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: package / installed smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build distribution artifacts
        run: |
          uv lock --check
          uv build --sdist --wheel --out-dir dist

      - name: Install wheel in a clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install dist/*.whl

      - name: Verify installed command and packaged resources
        run: |
          .ci-venv/bin/bili-asr --help
          .ci-venv/bin/python -m bili_asr.contracts --check-docs docs/contracts
          .ci-venv/bin/python - <<'PY'
          import hashlib
          from importlib.resources import files
          from pathlib import Path, PurePosixPath
          from bili_asr.contracts import CONTRACTS

          for entry in CONTRACTS.values():
              for name in entry.authority:
                  relative = PurePosixPath(name)
                  if relative.suffix in {".sql", ".json"}:
                      relative = relative.relative_to("src/bili_asr")
                      body = files("bili_asr").joinpath(*relative.parts).read_bytes()
                      expected = Path(name).read_bytes()
                      if not body or hashlib.sha256(body).digest() != hashlib.sha256(expected).digest():
                          raise SystemExit(f"packaged contract resource differs: {name}")
          PY

      - name: Write build provenance and checksums
        run: |
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILDINFO
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload distribution artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ github.run_id }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: tests / coverage report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: python
    if: ${{ !cancelled() && (needs.python.result == 'success' || needs.python.result == 'failure') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Reporting reads the checked-out sources; it does not import the project.
      - name: Verify lockfile and install coverage tooling
        run: |
          uv lock --check
          uv sync --locked --extra dev

      - name: Download pytest diagnostics
        uses: actions/download-artifact@v7
        with:
          pattern: pytest-diagnostics-${{ github.run_id }}-*
          merge-multiple: true
          path: test-results
          if-no-artifact-found: warn

      - name: Summarize regression tests
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          files = sorted(Path("test-results").rglob("pytest-*.xml"))
          if not files:
              raise SystemExit("no shard JUnit reports were downloaded")
          total = failures = errors = skipped = 0
          for path in files:
              for case in ET.parse(path).getroot().iter("testcase"):
                  total += 1
                  failures += int(case.find("failure") is not None)
                  errors += int(case.find("error") is not None)
                  skipped += int(case.find("skipped") is not None)
          passed = total - failures - errors - skipped
          status = "PASS" if failures == errors == 0 else "FAIL"
          lines = [
              "## Regression tests",
              "",
              f"**{status}**: {passed} passed, {failures} failed, "
              f"{errors} errors, {skipped} skipped ({total} total).",
              "",
              "Reports: " + ", ".join(path.name for path in files),
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          if failures or errors:
              raise SystemExit("regression test failures are present in shard reports")
          PY

      - name: Download shard coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-data-${{ github.run_id }}-*
          merge-multiple: true

      - name: Combine coverage data
        id: combine
        run: |
          uv run --no-sync coverage combine

      - name: Generate coverage report
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: |
          uv run --no-sync coverage report --show-missing
          uv run --no-sync coverage xml -o coverage.xml
          uv run --no-sync coverage json -o coverage.json

      - name: Enforce product coverage floors
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: uv run --no-sync python scripts/check_test_coverage.py coverage.json --line-min 75 --branch-min 63

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
          retention-days: 14
