; Replace absolute paths after generating a private maintenance backup-policy.
[program:bili-asr-archive-backup]
command=/opt/bili-asr/.venv/bin/python /opt/bili-asr/scripts/deployment/run_archive_backup.py --policy /etc/bili-asr/backup-policy.json --poll-seconds 60
directory=/opt/bili-asr
autostart=true
autorestart=unexpected
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
umask=0077
stdout_logfile=/srv/bilibili/production-ops/archive-backup.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
