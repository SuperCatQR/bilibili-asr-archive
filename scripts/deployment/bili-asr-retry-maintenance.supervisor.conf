; Copy to the container supervisor configuration and replace absolute paths.
; The five control paths must match every other writer of retry state.
[program:bili-asr-retry-maintenance]
command=/opt/bili-asr/.venv/bin/python /opt/bili-asr/scripts/deployment/run_retry_maintenance.py --bin /opt/bili-asr/.venv/bin/bili-asr --archive-root /srv/bilibili/archive --policy /etc/bili-asr/retry-policy.json --state /srv/bilibili/production-ops/state.json --lock /srv/bilibili/production-ops/maintenance.lock --health /srv/bilibili/production-ops/retry-maintenance-health.json
directory=/opt/bili-asr
autostart=true
autorestart=unexpected
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=10
umask=0077
stdout_logfile=/srv/bilibili/production-ops/retry-maintenance.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
